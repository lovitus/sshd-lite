name: Follow upstream, test and release
on:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_release:
        description: Published stable upstream release tag (empty selects latest release)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      upstream: ${{ steps.source.outputs.upstream }}
      needed: ${{ steps.source.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch upstream and apply patch
        id: source
        env:
          UPSTREAM_RELEASE: ${{ inputs.upstream_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/prepare.sh .build/source "$UPSTREAM_RELEASE"
          upstream=$(cat .build/source/UPSTREAM_COMMIT)
          upstream_release=$(cat .build/source/UPSTREAM_RELEASE)
          patch_revision=$(git ls-tree HEAD patches scripts .github/workflows/release.yml | git hash-object --stdin)
          tag="${upstream_release}-auth.${upstream:0:12}.${patch_revision:0:12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          needed=true
          if gh release view "$tag" --json isDraft --jq '.isDraft' > .build/is-draft 2>/dev/null; then
            if [[ $(cat .build/is-draft) == false ]]; then needed=false; fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          # CLAUDE.md is an upstream documentation symlink; Windows extraction cannot create it.
          tar --exclude=.git --exclude=./CLAUDE.md -czf .build/source.tar.gz -C .build/source .
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.needed == 'true'
        with:
          name: patched-source
          path: .build/source.tar.gz
          retention-days: 7
  test:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: patched-source
      - run: mkdir source && tar -xzf source.tar.gz -C source
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Full suite, race detector, vet and actual SSH/PTY login
        working-directory: source
        run: |
          go build ./...
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Upstream's vendored ConPTY code has documented unsafe-pointer vet findings.
            go test -race -vet=off -timeout 15m ./...
            go vet -unsafeptr=false ./...
            go vet .
          else
            go test -race -timeout 15m ./...
            go vet ./...
          fi
          go test -race -tags=integration -run TestVirtualAuthEndToEnd -count=1 -v -timeout 5m .
  build:
    needs: [prepare, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: patched-source
          path: .build
      - run: mkdir .build/source && tar -xzf .build/source.tar.gz -C .build/source
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .build/source/go.mod
          cache-dependency-path: .build/source/go.sum
      - name: Build portable executables and provenance
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
        run: |
          scripts/package.sh .build/source dist "$VERSION"
          cp .build/source.tar.gz "dist/sshd-lite_${VERSION}_source.tar.gz"
          cp README.md dist/README.md
          cp .build/source/UPSTREAM_RELEASE .build/source/UPSTREAM_COMMIT .build/source/PATCH_REPOSITORY_COMMIT dist/
          (cd dist && sha256sum ./*.tar.gz ./*.zip README.md UPSTREAM_RELEASE UPSTREAM_COMMIT PATCH_REPOSITORY_COMMIT > SHA256SUMS)
          printf 'Upstream release: %s\nPatched upstream: %s\nPatch repository commit: %s\n\nLinux, macOS and Windows source tests and SSH/PTY logins passed. Packaged executable verification is pending.\n\nSee README.md for environment and credential-file usage.\n' "$(cat .build/source/UPSTREAM_RELEASE)" "$UPSTREAM" "$GITHUB_SHA" > .build/release-notes.md
      - name: Upload draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --draft --title "$VERSION" --notes-file .build/release-notes.md
          fi
          gh release upload "$VERSION" dist/* --clobber

  verify_release:
    name: Download and test release (${{ matrix.target }})
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64
          - os: macos-latest
            target: darwin_arm64
          - os: windows-latest
            target: windows_amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: patched-source
          path: .build
      - run: mkdir .build/source && tar -xzf .build/source.tar.gz -C .build/source
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .build/source/go.mod
          cache-dependency-path: .build/source/go.sum
      - name: Download actual GitHub Release archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release download "$VERSION" --dir downloaded --pattern "sshd-lite_${VERSION}_${TARGET}.*" --pattern SHA256SUMS
      - name: Verify checksum and extract executable
        id: unpack
        run: python scripts/verify-archive.py downloaded
      - name: Test downloaded executable (no daemon rebuild)
        env:
          SSHD_LITE_TEST_BINARY: ${{ steps.unpack.outputs.binary }}
        working-directory: .build/source
        run: go test -race -tags=integration -run TestVirtualAuthEndToEnd -count=1 -v -timeout 5m .
  publish:
    needs: [prepare, verify_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "$VERSION" --json body --jq .body > notes.md
          python - <<'PYCODE'
          from pathlib import Path
          p = Path('notes.md')
          p.write_text(p.read_text().replace('Packaged executable verification is pending.', 'Release archives were downloaded from GitHub, SHA-256 verified, and their actual executables passed password auth, file/env merging, SFTP, exit status and interactive terminal tests on Linux amd64, macOS arm64 and Windows amd64. Other architectures are cross-compiled.'))
          PYCODE
          gh release edit "$VERSION" --notes-file notes.md --draft=false --latest
